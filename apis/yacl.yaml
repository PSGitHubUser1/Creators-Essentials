---
fabric-1.21.8:
  gradle: |
    repositories {
    maven {
        name = "QuiltMC"
        url = "https://maven.quiltmc.org/repository/release/"
      }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
      }
    mavenCentral()
    }

    dependencies {
      modImplementation "org.quiltmc.parsers:json:0.3.1"
      modImplementation "maven.modrinth:yacl:3.7.1+1.21.6-fabric"
    }
 
  update_files:
    - ~
name: "YACL Lib"
